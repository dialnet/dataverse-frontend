# nginx de la imagen de producción de la SPA (ver Dockerfile).
#
# Sirve exclusivamente `/modern`. Todo lo demás del hostname —la interfaz clásica de Dataverse,
# `/api`, los estáticos— lo sirve la instalación de Dataverse, y quien reparte es el proxy que
# haya delante; aquí no hay nada que reenviar.

server {
    # 8080 y no 80: así el contenedor puede correr sin privilegios (los puertos por debajo de
    # 1024 los reserva root) y es el puerto que ya usan el resto de imágenes del despliegue.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── La aplicación ────────────────────────────────────────────────────────
    # Fallback de SPA: cualquier ruta que no sea un fichero se resuelve con index.html, porque las
    # rutas de react-router (/modern/dataset?persistentId=..., /modern/collections/...) no existen
    # en disco. Si esto falta, la aplicación funciona al navegar por dentro y da 404 al recargar.
    location /modern/ {
        try_files $uri $uri/ /modern/index.html;
    }

    location = /modern {
        return 301 /modern/;
    }

    # ── Política de caché ────────────────────────────────────────────────────
    # Los bundles llevan hash en el nombre y son inmutables; los ficheros que NO lo llevan
    # tienen que poder cambiar en un redespliegue. Sin esto, un navegador sigue usando la
    # configuración del despliegue anterior y se acaba depurando un fallo que ya está arreglado.
    location /modern/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # config.js e index.html son los dos ficheros que cambian entre despliegues. Nunca se
    # cachean.
    location = /modern/config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /modern/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Las traducciones las carga `i18next-http-backend` en ejecución, del mismo servidor. Cachear
    # poco: cambian con la aplicación pero no llevan hash en el nombre.
    location /modern/locales/ {
        expires 5m;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
