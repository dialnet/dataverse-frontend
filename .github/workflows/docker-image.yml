# Construye la imagen de contenedor de la SPA (ver Dockerfile) y la publica en GitHub Container
# Registry.
#
# Una sola imagen sirve para cualquier despliegue: la configuración no se hornea en el build, se
# escribe en el arranque del contenedor (docker-entrypoint-config.sh). Eso es lo que permite
# desplegar una rama o un pull request sin reconstruir nada.
#
# ── Tags que publica ─────────────────────────────────────────────────────────────────────────
#
#   push a una rama    <rama>            móvil    p. ej. `develop-dialnet`
#   pull request       pr-<N>            móvil    siempre el último build de ese PR
#   cualquiera         sha-<commit>      inmutable
#
# ── Pull requests desde forks ────────────────────────────────────────────────────────────────
# Un PR abierto desde un fork recibe un GITHUB_TOKEN de solo lectura, así que no puede publicar.
# En ese caso la imagen se construye igual —que es lo que valida el PR— pero no se sube.

name: docker image

on:
  push:
    branches:
      - develop
      - develop-dialnet
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Path bajo el que se sirve la SPA. Es lo único específico del despliegue que queda horneado, y
  # es un path, no un hostname.
  BASE_PATH: /modern

# Un push nuevo a la misma rama o PR cancela el build anterior: no interesa terminar de construir
# una versión que ya está obsoleta.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # `write` para publicar la imagen en GHCR; la lectura que implica es además lo que permite
      # instalar `@iqss/dataverse-client-javascript` desde GitHub Packages durante el build.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Un PR desde un fork no puede publicar (token de solo lectura). Se calcula una vez aquí en
      # vez de repetir la condición en cada paso.
      - name: ¿Se puede publicar?
        id: puede
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "PR desde un fork: se construye pero no se publica."
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        if: steps.puede.outputs.publicar == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          # Sin `latest` automático: en este repo la rama de referencia no es `main`, así que
          # `latest` no significaría nada evidente. Quien despliegue nombra la rama o el PR.
          flavor: |
            latest=false

      - name: Construir (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            BASE_PATH=${{ env.BASE_PATH }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          load: true
          tags: dvf:test
          # La cache de Actions ahorra el `npm install` del monorepo, que es lo caro con
          # diferencia. `mode=max` guarda también las capas intermedias del build multietapa.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Se prueba ANTES de publicar: así un tag móvil como `pr-<N>` nunca apunta a una imagen
      # que no arranca. Comprueba lo que un build correcto no garantiza — que el entrypoint
      # escribe la configuración, y que el fallback de SPA responde a una ruta que no existe en
      # disco (si devolviera 404, recargar la página rompería la aplicación).
      - name: Probar la imagen
        run: |
          docker run -d --name dvf-test -p 8080:8080 \
            -e DATAVERSE_BACKEND_URL=https://dataverse.example.org \
            -e OIDC_CLIENT_ID=dataverse-spa \
            -e OIDC_AUTHORIZATION_ENDPOINT=https://auth.example.org/realms/dataverse/protocol/openid-connect/auth \
            -e OIDC_TOKEN_ENDPOINT=https://auth.example.org/realms/dataverse/protocol/openid-connect/token \
            -e OIDC_LOGOUT_ENDPOINT=https://auth.example.org/realms/dataverse/protocol/openid-connect/logout \
            dvf:test

          for i in $(seq 1 30); do
            curl -sf "http://localhost:8080${BASE_PATH}/config.js" >/dev/null && break
            sleep 1
          done

          echo "── config.js ──"
          curl -sf "http://localhost:8080${BASE_PATH}/config.js" | tee /tmp/config.js
          grep -q 'dataverse.example.org' /tmp/config.js

          echo "── fallback de SPA ──"
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${BASE_PATH}/una/ruta/que/no/existe")
          echo "HTTP $code"
          [ "$code" = "200" ]

          docker logs dvf-test
          docker rm -f dvf-test

      # Ya está todo en cache: esto solo etiqueta y sube.
      - name: Publicar
        if: steps.puede.outputs.publicar == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            BASE_PATH=${{ env.BASE_PATH }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
